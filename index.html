<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageEdit — ビジュアルWebエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f6;--bg3:#f0eeeb;
  --text:#111110;--text2:#6b6b68;--text3:#a8a8a4;
  --border:#e5e4e0;--border2:#d0cfca;
  --accent:#3b7ef6;--accent-bg:#e8f0fe;--accent-text:#1a56c4;
  --danger:#e24b4a;--success:#1d9e75;
  --radius:8px;--radius-lg:12px;
}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--bg2);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
button,input,select,textarea{font-family:inherit}

/* topbar */
#topbar{height:44px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;padding:0 10px;flex-shrink:0;z-index:20}
.tb-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--border)}
.tb-group:last-child{border:none}
.tb-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:6px;color:var(--text2);transition:all .12s}
.tb-btn:hover{background:var(--bg2)}
.tb-btn.active{background:var(--bg3);color:var(--text)}
.tb-btn svg{width:15px;height:15px;flex-shrink:0}
.tb-add{height:28px;padding:0 10px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.tb-add:hover{background:var(--bg2)}
.tb-select{height:28px;border:1px solid var(--border2);border-radius:6px;padding:0 6px;font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;outline:none}
.tb-select:focus{border-color:var(--accent)}
.tb-label{font-size:11px;color:var(--text3);padding:0 3px}
.color-sw{width:26px;height:26px;border-radius:5px;border:1px solid var(--border2);cursor:pointer;padding:2px;flex-shrink:0;background:var(--bg)}
.logo{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.02em;padding:0 4px}
.mode-toggle{display:flex;background:var(--bg3);border-radius:7px;padding:2px}
.mode-btn{height:26px;padding:0 12px;border:none;background:transparent;border-radius:5px;font-size:12px;color:var(--text2);cursor:pointer}
.mode-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:500}

/* body */
#body{display:flex;flex:1;overflow:hidden;min-height:0}
body.is-preview #left-bar,body.is-preview #right-panel,body.is-preview .edit-only{opacity:.4;pointer-events:none}

/* left bar */
#left-bar{width:60px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;flex-shrink:0;overflow-y:auto}
.side-btn{width:48px;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;cursor:pointer;border-radius:8px;color:var(--text2);transition:all .12s;flex-shrink:0}
.side-btn:hover{background:var(--bg2);color:var(--text)}
.side-btn svg{width:16px;height:16px;flex-shrink:0}
.side-btn span{font-size:9px;line-height:1.1;color:inherit;white-space:nowrap}
.side-sep{width:32px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}

/* canvas */
#canvas-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:28px;background:#d8d8d5;background-image:radial-gradient(circle,#bbbbb8 1px,transparent 1px);background-size:20px 20px;min-height:0}
#canvas{width:800px;height:480px;background:#fff;position:relative;flex-shrink:0;box-shadow:0 2px 20px rgba(0,0,0,.12)}

/* elements */
.el{position:absolute;cursor:move;user-select:none}
.el.locked{cursor:default}
.el.selected .el-inner{outline:2px solid var(--accent);outline-offset:1px}
.el.selected.locked .el-inner{outline-style:dashed}
#canvas:not(.preview) .el-inner *{pointer-events:none}
#canvas.preview .el{cursor:default;user-select:auto}
.el-inner[contenteditable="true"]{cursor:text;user-select:text}
.el-handle{position:absolute;width:8px;height:8px;background:var(--accent);border:1.5px solid #fff;border-radius:2px;z-index:10;box-shadow:0 0 0 1px var(--accent)}
.el-handle.tl{top:-4px;left:-4px;cursor:nw-resize}
.el-handle.tr{top:-4px;right:-4px;cursor:ne-resize}
.el-handle.bl{bottom:-4px;left:-4px;cursor:sw-resize}
.el-handle.br{bottom:-4px;right:-4px;cursor:se-resize}
.el-handle.tm{top:-4px;left:50%;transform:translateX(-50%);cursor:n-resize}
.el-handle.bm{bottom:-4px;left:50%;transform:translateX(-50%);cursor:s-resize}
.el-handle.lm{left:-4px;top:50%;transform:translateY(-50%);cursor:w-resize}
.el-handle.rm{right:-4px;top:50%;transform:translateY(-50%);cursor:e-resize}
.anim-badge{position:absolute;top:-11px;right:0;font-size:9px;padding:1px 5px;background:var(--accent);color:#fff;border-radius:6px;pointer-events:none;white-space:nowrap;font-family:'DM Mono',monospace}
.lock-badge{position:absolute;top:-11px;left:0;font-size:9px;padding:1px 5px;background:var(--text2);color:#fff;border-radius:6px;pointer-events:none}

/* right panel */
#right-panel{width:248px;background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#rpanel-tabs{display:flex;border-bottom:1px solid var(--border)}
.rptab{flex:1;padding:9px 4px;font-size:11px;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .12s}
.rptab.active{color:var(--text);border-bottom-color:var(--accent);background:var(--bg)}
#rpanel-content{flex:1;overflow-y:auto;padding:12px}
.p-section{margin-bottom:16px}
.p-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.p-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.p-label{font-size:11px;color:var(--text2);width:52px;flex-shrink:0}
.p-input{flex:1;min-width:0;height:26px;font-size:11px;padding:0 7px;border:1px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);outline:none}
.p-input:focus{border-color:var(--accent)}
.p-input:disabled{background:var(--bg2);color:var(--text3)}
.p-input.narrow{flex:0 0 52px}
.p-unit{font-size:10px;color:var(--text3);flex-shrink:0}
.p-check{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);cursor:pointer}
.p-hint{font-size:10px;color:var(--text3);margin:-2px 0 6px 58px}
.no-sel{padding:24px 12px;text-align:center;color:var(--text3);font-size:12px;line-height:1.8}
.no-sel-icon{font-size:24px;margin-bottom:8px;opacity:.4}

/* layers */
#layers-wrap{border-top:1px solid var(--border);flex-shrink:0}
#layers-head{padding:6px 12px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase}
#layers-panel{max-height:180px;overflow-y:auto}
.layer-item{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;cursor:pointer;font-size:11px;color:var(--text2);transition:background .1s;border-top:1px solid transparent;border-bottom:1px solid transparent}
.layer-item:hover{background:var(--bg2)}
.layer-item.active{background:var(--accent-bg);color:var(--accent-text)}
.layer-item.is-hidden .layer-name{opacity:.45;text-decoration:line-through}
.layer-item.dragging{opacity:.4}
.layer-item.drop-target{border-top-color:var(--accent)}
.layer-icon{width:15px;height:15px;border:1px solid currentColor;border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-anim-tag{font-size:9px;padding:1px 5px;background:var(--accent);color:#fff;border-radius:4px;flex-shrink:0}
.layer-btn{width:20px;height:20px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.layer-btn:hover{background:var(--bg3);color:var(--text)}
.layer-btn.on{color:var(--text)}
.layer-btn svg{width:13px;height:13px}

/* anim panel */
.anim-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.anim-label{font-size:11px;color:var(--text2);width:52px;flex-shrink:0}
.anim-select,.anim-input{height:26px;font-size:11px;padding:0 6px;border:1px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);outline:none}
.anim-select:focus,.anim-input:focus{border-color:var(--accent)}
.anim-select{flex:1;min-width:0}
.anim-input{width:58px}
.el-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:var(--accent-bg);color:var(--accent-text);margin-bottom:10px;font-weight:500}
.btn-primary{flex:1;height:28px;font-size:11px;border:1px solid var(--accent);border-radius:5px;cursor:pointer;background:var(--accent-bg);color:var(--accent-text);font-weight:500;transition:all .12s}
.btn-primary:hover{background:var(--accent);color:#fff}
.btn-ghost{flex:1;height:28px;font-size:11px;border:1px solid var(--border2);border-radius:5px;cursor:pointer;background:transparent;color:var(--text2);transition:all .12s}
.btn-ghost:hover{background:var(--bg2)}

/* preview bar */
#preview-bar{height:40px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
.prev-btn{height:28px;padding:0 14px;font-size:12px;border-radius:6px;cursor:pointer;transition:all .12s;font-weight:500;border:1px solid}
.prev-btn.play{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.prev-btn.play:hover,.prev-btn.play.on{background:var(--accent);color:#fff}
.prev-btn.stop{background:transparent;color:var(--text2);border-color:var(--border2)}
.prev-btn.stop:hover{background:var(--bg2)}
.prev-btn.export{background:transparent;color:var(--accent-text);border-color:var(--accent)}
.prev-btn.export:hover{background:var(--accent-bg)}
#anim-info{font-size:11px;color:var(--text3);margin-left:4px}
#ph-time{font-size:11px;color:var(--text3);margin-left:auto;font-variant-numeric:tabular-nums}

/* timeline */
#timeline-bar{height:60px;background:var(--bg);border-top:1px solid var(--border);display:flex;flex-shrink:0;overflow:hidden}
#tl-labels{width:108px;height:100%;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;padding:4px 10px;flex-shrink:0}
#tl-head-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding-bottom:2px}
#tl-track{flex:1;height:100%;position:relative;overflow:hidden;cursor:pointer}
#tl-ruler{position:absolute;top:0;left:0;right:0;height:18px;border-bottom:1px solid var(--border)}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:10}
#playhead::before{content:'';position:absolute;top:0;left:-4px;width:10px;height:10px;background:var(--accent);border-radius:50%}
#tl-els{position:absolute;top:0;left:0;right:0;bottom:0}

/* statusbar */
#statusbar{height:24px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:18px;flex-shrink:0;font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums}

/* context menu */
#ctx-menu{position:fixed;display:none;min-width:190px;max-height:70vh;overflow-y:auto;background:var(--bg);border:1px solid var(--border2);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:4px;z-index:100}
.ctx-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 10px;border:none;background:transparent;border-radius:5px;font-size:12px;color:var(--text);cursor:pointer;text-align:left}
.ctx-item:hover:not(:disabled){background:var(--accent-bg);color:var(--accent-text)}
.ctx-item:disabled{color:var(--text3);cursor:default}
.ctx-item.danger{color:var(--danger)}
.ctx-item kbd{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-group">
      <span class="logo">PageEdit</span>
    </div>
    <div class="tb-group edit-only">
      <button class="tb-btn" onclick="undo()" title="元に戻す (Ctrl+Z)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h7a4 4 0 0 1 0 8H5"/><path d="M2 6l3-3M2 6l3 3"/></svg>
      </button>
      <button class="tb-btn" onclick="redo()" title="やり直す (Ctrl+Y)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 6H7a4 4 0 0 0 0 8h4"/><path d="M14 6l-3-3M14 6l-3 3"/></svg>
      </button>
    </div>
    <div class="tb-group edit-only">
      <button class="tb-add" id="add-btn" onclick="openAddMenu(this)">＋ 要素を追加 ▾</button>
    </div>
    <div class="tb-group edit-only">
      <span class="tb-label">フォント</span>
      <select class="tb-select" id="font-family" onchange="applyProp('fontFamily',this.value,true)" style="width:132px">
        <option value="'DM Sans',sans-serif">DM Sans</option>
        <option value="'Playfair Display',serif">Playfair Display</option>
        <option value="'DM Mono',monospace">DM Mono</option>
        <option value="sans-serif">sans-serif</option>
        <option value="serif">serif</option>
        <option value="monospace">monospace</option>
        <option value="Georgia,serif">Georgia</option>
        <option value="Arial,sans-serif">Arial</option>
      </select>
      <input type="number" class="tb-select" id="font-size" value="16" min="8" max="120" style="width:56px" oninput="applyProp('fontSize',this.value+'px')" onchange="saveHistory()">
      <button class="tb-btn" id="bold-btn" onclick="toggleBold()" title="太字 (Ctrl+B)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h4.5a3 3 0 0 1 2 5.2A3.3 3.3 0 0 1 9 14H4V2zm2 2v3h2.5a1.5 1.5 0 0 0 0-3H6zm0 5v3h3a1.5 1.5 0 0 0 0-3H6z"/></svg></button>
      <button class="tb-btn" id="italic-btn" onclick="toggleItalic()" title="斜体 (Ctrl+I)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M7 2h6v2h-2.2l-2.6 8H10v2H4v-2h2.2l2.6-8H7V2z"/></svg></button>
    </div>
    <div class="tb-group edit-only">
      <button class="tb-btn" onclick="bringForward()" title="前面へ">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="5" width="10" height="10" rx="1"/><rect x="5" y="1" width="10" height="10" rx="1" fill="var(--bg)"/></svg>
      </button>
      <button class="tb-btn" onclick="sendBackward()" title="背面へ">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="1" width="10" height="10" rx="1"/><rect x="1" y="5" width="10" height="10" rx="1" fill="var(--bg)"/></svg>
      </button>
      <button class="tb-btn" onclick="duplicate()" title="複製 (Ctrl+D)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="10" height="10" rx="1"/><path d="M3 11V3h8"/></svg>
      </button>
      <button class="tb-btn" onclick="deleteSelected()" title="削除 (Del)" style="color:var(--danger)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M5 5l1 8h4l1-8"/></svg>
      </button>
    </div>
    <div class="tb-group" style="margin-left:auto">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-edit" onclick="setMode('edit')">編集</button>
        <button class="mode-btn" id="mode-preview" onclick="setMode('preview')">プレビュー</button>
      </div>
    </div>
  </div>

  <div id="body">
    <div id="left-bar"></div>

    <div id="canvas-wrap" onmousedown="handleCanvasMouseDown(event)" oncontextmenu="handleCanvasContext(event)">
      <div id="canvas"></div>
    </div>

    <div id="right-panel">
      <div id="rpanel-tabs">
        <div class="rptab active" onclick="switchPanel('props')">プロパティ</div>
        <div class="rptab" onclick="switchPanel('anim')">アニメーション</div>
      </div>

      <div id="rpanel-content">
        <!-- props panel -->
        <div id="props-panel">
          <div class="no-sel" id="no-sel-msg">
            <div class="no-sel-icon">⬚</div>
            要素を選択するか<br>左から追加してください
          </div>
          <div id="props-content" style="display:none">
            <div class="el-badge" id="props-el-name">要素</div>
            <div class="p-section">
              <div class="p-title">位置とサイズ</div>
              <div class="p-row"><span class="p-label">X</span><input class="p-input pos-input" id="px" type="number" oninput="applyPos()" onchange="saveHistory()"><span class="p-unit">px</span></div>
              <div class="p-row"><span class="p-label">Y</span><input class="p-input pos-input" id="py" type="number" oninput="applyPos()" onchange="saveHistory()"><span class="p-unit">px</span></div>
              <div class="p-row"><span class="p-label">幅</span><input class="p-input pos-input" id="pw" type="number" oninput="applySize()" onchange="saveHistory()"><span class="p-unit">px</span></div>
              <div class="p-row"><span class="p-label">高さ</span><input class="p-input pos-input" id="ph" type="number" oninput="applySize()" onchange="saveHistory()"><span class="p-unit">px</span></div>
            </div>
            <div class="p-section">
              <div class="p-title">スタイル</div>
              <div class="p-row"><span class="p-label">塗り</span>
                <input type="color" class="color-sw" id="pbg" oninput="applyFill()" onchange="saveHistory()">
                <label class="p-check"><input type="checkbox" id="pbg-none" onchange="applyFill();saveHistory()">透明</label>
              </div>
              <div class="p-row"><span class="p-label">ボーダー</span>
                <input type="color" class="color-sw" id="pbcolor" oninput="applyBorder()" onchange="saveHistory()">
                <input class="p-input narrow" id="pbwidth" type="number" min="0" max="20" step="0.5" oninput="applyBorder()" onchange="saveHistory()">
                <span class="p-unit">px</span>
              </div>
              <div class="p-row"><span class="p-label">線種</span>
                <select class="p-input" id="pbstyle" onchange="applyBorder();saveHistory()">
                  <option value="solid">実線</option><option value="dashed">破線</option><option value="dotted">点線</option><option value="double">二重線</option>
                </select>
              </div>
              <div class="p-row"><span class="p-label">角丸</span><input class="p-input" id="pradius" type="number" min="0" oninput="applyProp('borderRadius',this.value+'px')" onchange="saveHistory()"><span class="p-unit">px</span></div>
              <div class="p-row"><span class="p-label">透明度</span><input class="p-input" id="popacity" type="number" min="0" max="100" oninput="applyProp('opacity',Math.min(100,Math.max(0,+this.value))/100)" onchange="saveHistory()"><span class="p-unit">%</span></div>
              <div class="p-row"><span class="p-label">影</span>
                <select class="p-input" id="pshadow" onchange="applyProp('boxShadow',this.value,true)"></select>
              </div>
            </div>
            <div class="p-section" id="text-props">
              <div class="p-title">テキスト</div>
              <div class="p-row" id="row-text"><span class="p-label" id="ptext-label">内容</span><input class="p-input" id="ptext" oninput="applyProp('text',this.value)" onchange="saveHistory()"></div>
              <div class="p-hint" id="ptext-hint">カンマ区切りで入力</div>
              <div class="p-row" id="row-ph"><span class="p-label">プレースホルダー</span><input class="p-input" id="pplaceholder" oninput="applyProp('placeholder',this.value)" onchange="saveHistory()"></div>
              <div class="p-row" id="row-color"><span class="p-label" id="pcolor-label">文字色</span><input type="color" class="color-sw" id="pcolor" oninput="applyProp('color',this.value)" onchange="saveHistory()"></div>
              <div class="p-row" id="row-align"><span class="p-label">揃え</span>
                <select class="p-input" id="palign" onchange="applyProp('textAlign',this.value,true)">
                  <option value="left">左</option><option value="center">中央</option><option value="right">右</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- anim panel -->
        <div id="anim-panel" style="display:none">
          <div class="no-sel" id="anim-no-sel">
            <div class="no-sel-icon">◎</div>
            要素を選択して<br>アニメーションを設定
          </div>
          <div id="anim-content" style="display:none">
            <div class="el-badge" id="anim-el-name">要素</div>
            <div class="p-title">アニメーション</div>

              <span class="anim-label">種類</span>
              <select class="anim-select" id="anim-type" onchange="applyAnim()"></select>
            </div>
            <div class="anim-row">
              <span class="anim-label">時間</span>
              <input class="anim-input" id="anim-duration" type="number" value="0.6" min="0.1" max="10" step="0.1" oninput="applyAnim(false)" onchange="applyAnim()">
              <span class="p-unit">秒</span>
            </div>
            <div class="anim-row">
              <span class="anim-label">遅延</span>
              <input class="anim-input" id="anim-delay" type="number" value="0" min="0" max="10" step="0.1" oninput="applyAnim(false)" onchange="applyAnim()">
              <span class="p-unit">秒</span>
            </div>
            <div class="anim-row">
              <span class="anim-label">繰り返し</span>
              <select class="anim-select" id="anim-iter" onchange="applyAnim()">
                <option value="1">1回</option>
                <option value="2">2回</option>
                <option value="3">3回</option>
                <option value="infinite">ループ</option>

            <div class="anim-row">
              <span class="anim-label">イージング</span>
              <select class="anim-select" id="anim-easing" onchange="applyAnim()">
                <option value="ease">ease</option>
                <option value="ease-in">ease-in</option>
                <option value="ease-out">ease-out</option>
                <option value="ease-in-out">ease-in-out</option>
                <option value="linear">linear</option>
                <option value="cubic-bezier(0.34,1.56,0.64,1)">spring</option>
              </select>
            </div>
            <div class="anim-row">
              <span class="anim-label">方向</span>
              <select class="anim-select" id="anim-direction" onchange="applyAnim()">
                <option value="normal">normal</option>
                <option value="reverse">reverse</option>
                <option value="alternate">alternate</option>
              </select>
            </div>
            <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
              <div class="p-title">トリガー</div>
              <div class="anim-row">
                <span class="anim-label">開始</span>
                <select class="anim-select" id="anim-trigger" onchange="applyAnim()">
                  <option value="onLoad">ページ読込時</option>
                  <option value="onClick">クリック時</option>
                  <option value="onHover">ホバー時</option>
                </select>
              </div>
            </div>
            <div style="display:flex;gap:6px;margin-top:12px">
              <button class="btn-primary" onclick="previewAnim()">プレビュー ▶</button>
              <button class="btn-ghost" onclick="clearAnim()">クリア</button>

          </div>
        </div>
      </div>

      <div id="layers-wrap">
        <div id="layers-head">レイヤー</div>
        <div id="layers-panel"></div>
      </div>
    </div>
  </div>

  <div id="preview-bar">
    <button class="prev-btn play edit-only" id="play-btn" onclick="togglePlayback()">全アニメーション再生</button>
    <button class="prev-btn stop edit-only" onclick="stopPlayback()">停止</button>
    <span id="anim-info">アニメーション: 0個</span>
    <span id="ph-time">0.0s</span>
    <button class="prev-btn export" onclick="exportHTML()">HTMLを書き出す ↗</button>
  </div>

  <div id="timeline-bar">
    <div id="tl-labels">
      <div id="tl-head-label">タイムライン</div>
    </div>
    <div id="tl-track" onclick="seekTimeline(event)">
      <div id="tl-ruler"></div>
      <div id="playhead"></div>
      <div id="tl-els"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="st-pos">X: —  Y: —</span>
    <span id="st-size">W: —  H: —</span>
    <span id="st-canvas">キャンバス: 800 × 480</span>
    <span id="st-mode">編集モード</span>
    <span id="st-count" style="margin-left:auto">要素: 0</span>
  </div>
</div>

<div id="ctx-menu"></div>

<script>
const CANVAS_W=800,CANVAS_MIN_H=480;
const FONT_SANS="'DM Sans',sans-serif",FONT_SERIF="'Playfair Display',serif";

const ANIM_KF={
  fadeIn:'@keyframes kf-fadeIn{from{opacity:0}to{opacity:1}}',
  fadeOut:'@keyframes kf-fadeOut{from{opacity:1}to{opacity:0}}',
  slideLeft:'@keyframes kf-slideLeft{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}',
  slideRight:'@keyframes kf-slideRight{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}',
  slideUp:'@keyframes kf-slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}',
  slideDown:'@keyframes kf-slideDown{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}',
  zoomIn:'@keyframes kf-zoomIn{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}',
  zoomOut:'@keyframes kf-zoomOut{from{transform:scale(1.4);opacity:0}to{transform:scale(1);opacity:1}}',
  bounce:'@keyframes kf-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}70%{transform:translateY(-10px)}}',
  pulse:'@keyframes kf-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}',
  shake:'@keyframes kf-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}',
  spin:'@keyframes kf-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}',
  flip:'@keyframes kf-flip{0%{transform:perspective(400px) rotateY(90deg);opacity:0}100%{transform:perspective(400px) rotateY(0deg);opacity:1}}',
  rubberBand:'@keyframes kf-rubberBand{0%,100%{transform:scale(1,1)}30%{transform:scale(1.25,.75)}40%{transform:scale(.75,1.25)}50%{transform:scale(1.15,.85)}65%{transform:scale(.95,1.05)}75%{transform:scale(1.05,.95)}}',
  swing:'@keyframes kf-swing{0%,100%{transform:rotate(0)}20%{transform:rotate(15deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-5deg)}}',
  tada:'@keyframes kf-tada{0%,100%{transform:scale(1)}10%,20%{transform:scale(.9) rotate(-3deg)}30%,50%,70%,90%{transform:scale(1.1) rotate(3deg)}40%,60%,80%{transform:scale(1.1) rotate(-3deg)}}',
  heartbeat:'@keyframes kf-heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.18)}70%{transform:scale(1)}}',
};

const ANIM_GROUPS=[
  ['フェード',[['fadeIn','フェードイン'],['fadeOut','フェードアウト']]],
  ['スライド',[['slideLeft','左からスライド'],['slideRight','右からスライド'],['slideUp','下からスライド'],['slideDown','上からスライド']]],
  ['スケール',[['zoomIn','ズームイン'],['zoomOut','ズームアウト']]],
  ['注目',[['bounce','バウンス'],['pulse','パルス'],['shake','シェイク'],['spin','回転'],['flip','フリップ'],['rubberBand','ラバーバンド'],['swing','スウィング'],['tada','タダ！'],['heartbeat','鼓動']]],
];

const SHADOWS=[
  ['none','なし'],
  ['0 1px 3px rgba(0,0,0,.12)','小'],
  ['0 4px 14px rgba(0,0,0,.14)','中'],
  ['0 12px 32px rgba(0,0,0,.18)','大'],
];

// 要素タイプ定義（ラベル・アイコン・初期値）
const TYPES=[
  {type:'text',label:'テキスト',icon:'<path d="M3 4h10M8 4v9"/>',d:{w:200,h:44,text:'テキスト',fontSize:'18px'}},
  {type:'heading',label:'見出し',icon:'<path d="M3 3v10M11 3v10M3 8h8"/>',d:{w:360,h:60,text:'見出しテキスト',fontSize:'32px',fontFamily:FONT_SERIF,fontWeight:'600',textAlign:'left'}},
  {type:'rect',label:'四角形',icon:'<rect x="2" y="3" width="12" height="10" rx="1"/>',d:{w:160,h:100,bg:'#e3f0ff',border:'2px solid #3b7ef6',borderRadius:'4px'}},
  {type:'circle',label:'円',icon:'<circle cx="8" cy="8" r="5.5"/>',d:{w:100,h:100,bg:'#fde8e8',border:'2px solid #e24b4a',borderRadius:'50%'}},
  {type:'divider',label:'区切り線',icon:'<path d="M1 8h14"/>',d:{w:400,h:16,color:'#d0cfca'}},
  {type:'button',label:'ボタン',icon:'<rect x="1" y="4" width="14" height="8" rx="2"/>',d:{w:140,h:44,bg:'#3b7ef6',color:'#ffffff',text:'ボタン',fontSize:'14px',fontWeight:'600',borderRadius:'8px'}},
  {type:'input',label:'入力欄',icon:'<rect x="1" y="4" width="14" height="8" rx="1"/><path d="M4 6.5v3"/>',d:{w:240,h:40,bg:'#ffffff',border:'1px solid #d0cfca',borderRadius:'6px',fontSize:'14px',textAlign:'left',placeholder:'テキストを入力'}},
  {type:'textarea',label:'テキストエリア',short:'エリア',icon:'<rect x="1" y="2" width="14" height="12" rx="1"/><path d="M4 5h8M4 8h8M4 11h5"/>',d:{w:280,h:100,bg:'#ffffff',border:'1px solid #d0cfca',borderRadius:'6px',fontSize:'14px',textAlign:'left',placeholder:'メッセージを入力'}},
  {type:'checkbox',label:'チェックボックス',short:'チェック',icon:'<rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8l2 2 4-4"/>',d:{w:200,h:36,text:'同意する',fontSize:'14px',textAlign:'left'}},
  {type:'radio',label:'ラジオボタン',short:'ラジオ',icon:'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/>',d:{w:200,h:96,text:'選択肢A,選択肢B,選択肢C',fontSize:'14px',textAlign:'left'}},
  {type:'select',label:'セレクトボックス',short:'セレクト',icon:'<rect x="1" y="4" width="14" height="8" rx="1"/><path d="M10 7l1.5 1.5L13 7"/>',d:{w:200,h:40,bg:'#ffffff',border:'1px solid #d0cfca',borderRadius:'6px',text:'選択肢A,選択肢B,選択肢C',fontSize:'14px',textAlign:'left'}},
  {type:'slider',label:'スライダー',icon:'<path d="M1 8h14"/><circle cx="6" cy="8" r="2.5" fill="var(--bg)"/>',d:{w:240,h:56,text:'音量',fontSize:'13px',textAlign:'left'}},
  {type:'image',label:'画像',icon:'<rect x="1" y="2" width="14" height="12" rx="1"/><path d="M1 11l4-4 3 3 2-2 5 5"/>',d:{w:200,h:140,bg:'#f0eeeb',border:'1px solid #d0cfca',color:'#a8a8a4',borderRadius:'4px',fontSize:'12px'}},
  {type:'card',label:'カード',icon:'<rect x="1" y="2" width="14" height="12" rx="2"/><line x1="1" y1="6" x2="15" y2="6"/>',d:{w:240,h:170,bg:'#ffffff',border:'1px solid #e5e4e0',text:'カードタイトル',fontSize:'15px',fontWeight:'600',borderRadius:'12px',textAlign:'left',boxShadow:SHADOWS[1][0]}},
];
const TYPE_MAP=Object.fromEntries(TYPES.map(t=>[t.type,t]));
const BASE={bg:'transparent',border:'none',color:'#111110',fontSize:'16px',fontFamily:FONT_SANS,fontWeight:'normal',fontStyle:'normal',borderRadius:'0px',opacity:1,boxShadow:'none',text:'',textAlign:'center',placeholder:'',locked:false,hidden:false};

// 種類ごとのパネル表示
const INLINE_EDIT_TYPES=['text','heading','button'];
const NO_TEXT_TYPES=['divider','input','textarea','image'];
const NO_ALIGN_TYPES=['divider','image','checkbox','radio','select','slider'];
const PLACEHOLDER_TYPES=['input','textarea'];
const TEXT_LABELS={checkbox:'ラベル',slider:'ラベル',radio:'選択肢',select:'選択肢',card:'タイトル'};

let els=[],selId=null,idCount=0,hist=[],histIdx=-1;
let dragging=false,dragEl=null,dragOx=0,dragOy=0;
let resizing=false,resizeEl=null,resizeHandle='',resizeOx=0,resizeOy=0,resizeW0=0,resizeH0=0,resizeX0=0,resizeY0=0;
let activePanel='props',mode='edit',playing=false,phRAF=null,layerDragId=null;

const canvas=document.getElementById('canvas');
const canvasWrap=document.getElementById('canvas-wrap');
const $=id=>document.getElementById(id);

function uid(){return 'e'+(++idCount)}
function defAnim(){return{type:'none',duration:0.6,delay:0,iter:'1',easing:'ease',direction:'normal',trigger:'onLoad'}}
function hasAnim(el){return el.anim&&el.anim.type!=='none'}
function selected(){return els.find(x=>x.id===selId)}
function typeLabel(el){return TYPE_MAP[el.type]?TYPE_MAP[el.type].label:el.type}

function makeEl(type,over){
  return {id:uid(),type,x:60,y:50,w:100,h:40,...BASE,...JSON.parse(JSON.stringify(TYPE_MAP[type].d)),anim:defAnim(),...over};
}

function addEl(type,pos){
  const el=makeEl(type,{x:60+Math.random()*160|0,y:50+Math.random()*120|0});
  if(pos){el.x=Math.max(0,pos.x|0);el.y=Math.max(0,pos.y|0);}
  els.push(el);saveHistory();select(el.id);
}

// ---------- 描画（エディタとエクスポートで共通） ----------

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function splitOptions(s){return String(s||'').split(/[,、]/).map(x=>x.trim()).filter(Boolean)}

function animValue(a,delay){return `kf-${a.type} ${a.duration}s ${a.easing} ${delay}s ${a.iter} ${a.direction} both`}
function animCSS(a,delay){return a&&a.type!=='none'?`animation:${animValue(a,delay)};`:''}

const LAYOUT={
  button:'cursor:pointer;',
  checkbox:'justify-content:flex-start;',
  radio:'flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;',
  slider:'flex-direction:column;align-items:stretch;justify-content:center;gap:6px;',
  image:'flex-direction:column;justify-content:center;gap:6px;',
  card:'flex-direction:column;align-items:flex-start;justify-content:flex-start;',
};

function innerCSS(el){
  const justify={left:'flex-start',center:'center',right:'flex-end'}[el.textAlign]||'center';
  const pad=el.type==='divider'?'0':el.type==='card'?'14px':'10px';
  return `width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:${justify};overflow:hidden;padding:${pad};margin:0;background:${el.bg};border:${el.border};border-radius:${el.borderRadius};opacity:${el.opacity};box-shadow:${el.boxShadow||'none'};color:${el.color};font-family:${el.fontFamily};font-size:${el.fontSize};font-weight:${el.fontWeight};font-style:${el.fontStyle};text-align:${el.textAlign};${LAYOUT[el.type]||''}`;
}

const FORM_RESET='width:100%;height:100%;border:none;outline:none;background:transparent;font:inherit;color:inherit;text-align:inherit;padding:0;margin:0';
const LABEL_CSS='display:flex;align-items:center;gap:8px;cursor:pointer';

// 要素の中身の HTML。radioName はラジオのグループ名（要素ごとに一意）
function innerHTML(el,radioName){
  const t=escapeHTML(el.text||'');
  switch(el.type){
    case 'divider':return `<div style="width:100%;height:2px;background:${escapeHTML(el.color)}"></div>`;
    case 'input':return `<input type="text" placeholder="${escapeHTML(el.placeholder||'')}" style="${FORM_RESET}">`;
    case 'textarea':return `<textarea placeholder="${escapeHTML(el.placeholder||'')}" style="${FORM_RESET};resize:none"></textarea>`;
    case 'checkbox':return `<label style="${LABEL_CSS}"><input type="checkbox">${t}</label>`;
    case 'radio':return splitOptions(el.text).map(o=>`<label style="${LABEL_CSS}"><input type="radio" name="${radioName}" value="${escapeHTML(o)}">${escapeHTML(o)}</label>`).join('');
    case 'select':return `<select style="${FORM_RESET};cursor:pointer">${splitOptions(el.text).map(o=>`<option>${escapeHTML(o)}</option>`).join('')}</select>`;
    case 'slider':return `<label style="display:flex;justify-content:space-between;width:100%"><span>${t}</span><span>50</span></label><input type="range" min="0" max="100" value="50" style="width:100%;margin:0" oninput="this.previousElementSibling.lastElementChild.textContent=this.value">`;
    case 'image':return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="2"/><path d="M2 17l6-6 4 4 3-3 7 7"/></svg><span style="font-size:11px">画像プレースホルダー</span>`;
    case 'card':return `<div style="margin-bottom:6px">${t}</div><div style="font-size:12px;font-weight:normal;color:#8a8a86;line-height:1.6;flex:1">説明テキストがここに入ります。</div><a href="#" style="font-size:12px;font-weight:500;color:#3b7ef6;text-decoration:none">詳しく見る →</a>`;
    default:return t;
  }
}

function canvasHeight(){
  return els.reduce((m,e)=>e.hidden?m:Math.max(m,e.y+e.h+40),CANVAS_MIN_H);
}

function render(){
  const preview=mode==='preview';
  canvas.classList.toggle('preview',preview);
  canvas.innerHTML='';
  canvas.style.height=canvasHeight()+'px';
  els.forEach(el=>{
    if(el.hidden)return;
    const div=document.createElement('div');
    const isSel=!preview&&el.id===selId;
    div.className='el'+(isSel?' selected':'')+(el.locked?' locked':'');
    div.id=el.id;
    div.style.cssText=`left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;

    const inner=document.createElement('div');
    inner.className='el-inner';
    let anim='';
    if(playing)anim=animCSS(el.anim,el.anim.delay);
    else if(preview&&el.anim.trigger==='onLoad')anim=animCSS(el.anim,el.anim.delay);
    inner.style.cssText=innerCSS(el)+anim;
    inner.innerHTML=innerHTML(el,'r-'+el.id);
    div.appendChild(inner);

    if(preview){
      bindPreviewTrigger(div,inner,el);
    } else {
      if(hasAnim(el)){
        const badge=document.createElement('div');
        badge.className='anim-badge';badge.textContent=el.anim.type;
        div.appendChild(badge);
      }
      if(el.locked&&isSel){
        const lb=document.createElement('div');
        lb.className='lock-badge';lb.textContent='ロック中';
        div.appendChild(lb);
      }
      if(isSel&&!el.locked){
        ['tl','tm','tr','lm','rm','bl','bm','br'].forEach(h=>{
          const hd=document.createElement('div');
          hd.className=`el-handle ${h}`;
          hd.onmousedown=e=>{if(e.button!==0)return;e.stopPropagation();startResize(e,el.id,h)};
          div.appendChild(hd);
        });
      }
      div.onmousedown=e=>{e.stopPropagation();if(e.button!==0)return;startDrag(e,el.id)};
      div.ondblclick=e=>{e.stopPropagation();startInlineEdit(el.id)};
      div.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();select(el.id);showMenu(e.clientX,e.clientY,elementMenu(el.id))};
    }
    canvas.appendChild(div);
  });

  updateLayers();updateTimeline();updateStatus();
}

function updateStatus(){
  const ac=els.filter(hasAnim).length;
  $('anim-info').textContent=`アニメーション: ${ac}個`;
  $('st-count').textContent=`要素: ${els.length}`;
  $('st-canvas').textContent=`キャンバス: ${CANVAS_W} × ${canvasHeight()}`;
  $('st-mode').textContent=mode==='preview'?'プレビューモード':'編集モード';
  const el=selected();
  $('st-pos').textContent=el?`X: ${el.x}  Y: ${el.y}`:'X: —  Y: —';
  $('st-size').textContent=el?`W: ${el.w}  H: ${el.h}`:'W: —  H: —';
}

// プレビューモードでのクリック／ホバートリガー（書き出しHTMLと同じ動き）
function bindPreviewTrigger(div,inner,el){
  if(!hasAnim(el))return;
  const a=el.anim;
  const play=()=>{inner.style.animation='none';void inner.offsetWidth;inner.style.animation=animValue(a,0);};
  if(a.trigger==='onHover'){div.onmouseenter=play;div.onmouseleave=()=>{inner.style.animation='none'};}
  if(a.trigger==='onClick'){div.style.cursor='pointer';div.onclick=play;}
}

// ---------- ドラッグ・リサイズ ----------

function startDrag(e,id){
  if(resizing)return;
  select(id);
  const el=selected();
  if(!el||el.locked)return;
  dragging=true;dragEl=id;
  const cr=canvas.getBoundingClientRect();
  dragOx=e.clientX-cr.left-el.x;dragOy=e.clientY-cr.top-el.y;
  document.onmousemove=onDragMove;document.onmouseup=stopDrag;e.preventDefault();
}
function onDragMove(e){
  if(!dragging)return;
  const cr=canvas.getBoundingClientRect();
  const el=els.find(x=>x.id===dragEl);
  el.x=Math.max(0,e.clientX-cr.left-dragOx)|0;
  el.y=Math.max(0,e.clientY-cr.top-dragOy)|0;
  const div=$(dragEl);
  if(div){div.style.left=el.x+'px';div.style.top=el.y+'px';}
  updatePosFields(el);
}
function stopDrag(){dragging=false;dragEl=null;document.onmousemove=null;document.onmouseup=null;render();saveHistory();}

function startResize(e,id,handle){
  resizing=true;resizeEl=id;resizeHandle=handle;
  const el=els.find(x=>x.id===id);
  resizeW0=el.w;resizeH0=el.h;resizeX0=el.x;resizeY0=el.y;
  resizeOx=e.clientX;resizeOy=e.clientY;
  document.onmousemove=onResizeMove;document.onmouseup=stopResize;e.preventDefault();
}
function onResizeMove(e){
  if(!resizing)return;
  const dx=e.clientX-resizeOx,dy=e.clientY-resizeOy;
  const el=els.find(x=>x.id===resizeEl);
  let w=resizeW0,h=resizeH0,x=resizeX0,y=resizeY0;
  const hh=resizeHandle;
  if(hh.includes('r'))w=Math.max(20,resizeW0+dx);
  if(hh.includes('l')){w=Math.max(20,resizeW0-dx);x=resizeX0+resizeW0-w;}
  if(hh.includes('b'))h=Math.max(10,resizeH0+dy);
  if(hh.includes('t')){h=Math.max(10,resizeH0-dy);y=resizeY0+resizeH0-h;}
  el.w=w|0;el.h=h|0;el.x=Math.max(0,x|0);el.y=Math.max(0,y|0);
  const div=$(resizeEl);
  if(div){div.style.left=el.x+'px';div.style.top=el.y+'px';div.style.width=el.w+'px';div.style.height=el.h+'px';}
  updatePosFields(el);
}
function stopResize(){resizing=false;resizeEl=null;document.onmousemove=null;document.onmouseup=null;render();saveHistory();}

// ---------- 選択・パネル ----------

function select(id){
  if(mode==='preview')id=null;
  const el=els.find(x=>x.id===id&&!x.hidden);
  selId=el?el.id:null;
  const has=!!el;
  $('no-sel-msg').style.display=has?'none':'block';
  $('props-content').style.display=has?'block':'none';
  $('anim-no-sel').style.display=has?'none':'block';
  $('anim-content').style.display=has?'block':'none';
  if(el){updatePropPanel(el);updateAnimPanel(el);}
  render();
}

function handleCanvasMouseDown(e){
  hideMenu();
  if(mode==='edit'&&(e.target===canvasWrap||e.target===canvas))select(null);
}

function switchPanel(p){
  activePanel=p;
  document.querySelectorAll('.rptab').forEach((t,i)=>t.classList.toggle('active',['props','anim'][i]===p));
  $('props-panel').style.display=p==='props'?'block':'none';
  $('anim-panel').style.display=p==='anim'?'block':'none';
}

function show(id,on){$(id).style.display=on?'':'none'}

function updatePropPanel(el){
  $('props-el-name').textContent=typeLabel(el)+(el.locked?'（ロック中）':'');
  updatePosFields(el);
  document.querySelectorAll('.pos-input').forEach(i=>i.disabled=el.locked);
  $('pbg').value=hexColor(el.bg);
  $('pbg-none').checked=el.bg==='transparent';
  const b=parseBorder(el.border);
  $('pbcolor').value=b.color;$('pbwidth').value=b.w;$('pbstyle').value=b.style;
  $('pradius').value=parseInt(el.borderRadius)||0;
  $('popacity').value=Math.round(el.opacity*100);
  const sh=$('pshadow');
  if(![...sh.options].some(o=>o.value===el.boxShadow)){sh.add(new Option('カスタム',el.boxShadow));}
  sh.value=el.boxShadow||'none';
  // テキスト系
  show('row-text',!NO_TEXT_TYPES.includes(el.type));
  show('ptext-hint',el.type==='radio'||el.type==='select');
  show('row-ph',PLACEHOLDER_TYPES.includes(el.type));
  show('row-align',!NO_ALIGN_TYPES.includes(el.type));
  $('ptext-label').textContent=TEXT_LABELS[el.type]||'内容';
  $('pcolor-label').textContent=el.type==='divider'?'線色':'文字色';
  $('ptext').value=el.text||'';
  $('pplaceholder').value=el.placeholder||'';
  $('pcolor').value=hexColor(el.color);
  $('palign').value=el.textAlign||'center';
  // ツールバー
  $('font-size').value=parseInt(el.fontSize)||16;
  $('font-family').value=el.fontFamily;
  $('bold-btn').classList.toggle('active',isBold(el));
  $('italic-btn').classList.toggle('active',el.fontStyle==='italic');
}

function updateAnimPanel(el){
  $('anim-el-name').textContent=typeLabel(el)+(el.text?' — '+el.text.slice(0,14):'');
  const a=el.anim||defAnim();
  $('anim-type').value=a.type;
  $('anim-duration').value=a.duration;
  $('anim-delay').value=a.delay;
  $('anim-iter').value=a.iter;
  $('anim-easing').value=a.easing;
  $('anim-direction').value=a.direction;
  $('anim-trigger').value=a.trigger;
}

function updatePosFields(el){
  $('px').value=el.x;$('py').value=el.y;
  $('pw').value=el.w;$('ph').value=el.h;
  $('st-pos').textContent=`X: ${el.x}  Y: ${el.y}`;
  $('st-size').textContent=`W: ${el.w}  H: ${el.h}`;
}

function applyProp(prop,val,save){
  const el=selected();if(!el)return;
  el[prop]=val;render();
  if(save)saveHistory();
}

function applyFill(){
  const el=selected();if(!el)return;
  el.bg=$('pbg-none').checked?'transparent':$('pbg').value;
  render();
}

function applyBorder(){
  const el=selected();if(!el)return;
  const w=parseFloat($('pbwidth').value)||0;
  el.border=w<=0?'none':`${w}px ${$('pbstyle').value} ${$('pbcolor').value}`;
  render();
}

function parseBorder(b){
  const m=String(b||'').match(/([\d.]+)px\s+(\w+)\s+(.+)/);
  if(!m)return{w:0,style:'solid',color:'#3b7ef6'};
  return{w:+m[1],style:m[2],color:hexColor(m[3])};
}

function applyPos(){
  const el=selected();if(!el||el.locked)return;
  el.x=Math.max(0,parseInt($('px').value)||0);
  el.y=Math.max(0,parseInt($('py').value)||0);
  render();
}

function applySize(){
  const el=selected();if(!el||el.locked)return;
  el.w=Math.max(20,parseInt($('pw').value)||40);
  el.h=Math.max(10,parseInt($('ph').value)||20);
  render();
}

function isBold(el){return el.fontWeight==='bold'||+el.fontWeight>=600}

function toggleBold(){
  const el=selected();if(!el)return;
  el.fontWeight=isBold(el)?'normal':'bold';
  $('bold-btn').classList.toggle('active',isBold(el));
  render();saveHistory();
}

function toggleItalic(){
  const el=selected();if(!el)return;
  el.fontStyle=el.fontStyle==='italic'?'normal':'italic';
  $('italic-btn').classList.toggle('active',el.fontStyle==='italic');
  render();saveHistory();
}

function clampNum(v,min,max,def){v=parseFloat(v);return isNaN(v)?def:Math.min(max,Math.max(min,Math.round(v*10)/10))}

function applyAnim(save=true){
  const el=selected();if(!el)return;
  el.anim={
    type:$('anim-type').value,
    duration:clampNum($('anim-duration').value,0.1,10,0.6),
    delay:clampNum($('anim-delay').value,0,10,0),
    iter:$('anim-iter').value,
    easing:$('anim-easing').value,
    direction:$('anim-direction').value,
    trigger:$('anim-trigger').value,
  };
  render();
  if(save)saveHistory();
}

function clearAnim(){
  const el=selected();if(!el)return;
  el.anim=defAnim();
  updateAnimPanel(el);render();saveHistory();
}

function previewAnim(){
  const el=selected();if(!el||!hasAnim(el))return;
  const inner=document.querySelector(`#${el.id} .el-inner`);
  if(!inner)return;
  inner.style.animation='none';
  void inner.offsetHeight;
  inner.style.animation=animValue(el.anim,0);
}

// ---------- 並び順・複製・削除・ロック・表示 ----------

function moveTo(i,j){
  if(j<0||j>=els.length||i===j)return;
  const [m]=els.splice(i,1);els.splice(j,0,m);render();saveHistory();
}
function bringForward(){const i=els.findIndex(x=>x.id===selId);if(i>=0)moveTo(i,i+1)}
function sendBackward(){const i=els.findIndex(x=>x.id===selId);if(i>=0)moveTo(i,i-1)}
function bringToFront(){const i=els.findIndex(x=>x.id===selId);if(i>=0)moveTo(i,els.length-1)}
function sendToBack(){const i=els.findIndex(x=>x.id===selId);if(i>=0)moveTo(i,0)}

function duplicate(){
  const el=selected();if(!el)return;
  const copy={...JSON.parse(JSON.stringify(el)),id:uid(),x:el.x+20,y:el.y+20,locked:false};
  const i=els.indexOf(el);
  els.splice(i+1,0,copy);saveHistory();select(copy.id);
}

function deleteSelected(){
  const el=selected();if(!el||el.locked)return;
  els=els.filter(x=>x.id!==el.id);select(null);saveHistory();
}

function clearAll(){
  if(els.length===0)return;
  if(confirm('全ての要素を削除しますか？')){els=[];select(null);saveHistory();}
}

function toggleLock(id){
  const el=els.find(x=>x.id===id);if(!el)return;
  el.locked=!el.locked;saveHistory();
  if(id===selId)select(id);else render();
}

function toggleHidden(id){
  const el=els.find(x=>x.id===id);if(!el)return;
  el.hidden=!el.hidden;saveHistory();
  if(el.hidden&&id===selId)select(null);else render();
}

// ---------- 編集／プレビューモード ----------

function setMode(m){
  if(mode===m)return;
  if(document.activeElement&&document.activeElement.isContentEditable)document.activeElement.blur();
  stopPlayback();hideMenu();
  mode=m;
  $('mode-edit').classList.toggle('active',m==='edit');
  $('mode-preview').classList.toggle('active',m==='preview');
  document.body.classList.toggle('is-preview',m==='preview');
  select(null);
}

// ---------- アニメーション再生・タイムライン ----------

function togglePlayback(){
  if(mode!=='edit')return;
  playing=!playing;
  const btn=$('play-btn');
  btn.textContent=playing?'再生を止める':'全アニメーション再生';
  btn.classList.toggle('on',playing);
  render();
  if(playing)startPlayhead();else stopPlayheadAnim();
}

function stopPlayback(){
  playing=false;
  const btn=$('play-btn');
  btn.textContent='全アニメーション再生';btn.classList.remove('on');
  render();stopPlayheadAnim();
}

function timelineMax(){
  return Math.max(3,els.filter(e=>hasAnim(e)&&!e.hidden).reduce((m,e)=>Math.max(m,e.anim.delay+e.anim.duration),3));
}

function startPlayhead(){
  if(phRAF)cancelAnimationFrame(phRAF);
  const maxT=timelineMax();
  const ph=$('playhead');
  const start=performance.now();
  function tick(now){
    if(!playing)return;
    const t=((now-start)/1000)%maxT;
    ph.style.left=(t/maxT*100)+'%';
    $('ph-time').textContent=t.toFixed(1)+'s';
    phRAF=requestAnimationFrame(tick);
  }
  phRAF=requestAnimationFrame(tick);
}

function stopPlayheadAnim(){
  if(phRAF)cancelAnimationFrame(phRAF);phRAF=null;
}

function seekTimeline(e){
  const r=$('tl-track').getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  $('playhead').style.left=(pct*100)+'%';
  $('ph-time').textContent=(pct*timelineMax()).toFixed(1)+'s';
}

function updateTimeline(){
  const tlEls=$('tl-els');tlEls.innerHTML='';
  const ruler=$('tl-ruler');ruler.innerHTML='';
  const animated=els.filter(e=>hasAnim(e)&&!e.hidden);
  const maxT=timelineMax();
  for(let i=0;i<=Math.ceil(maxT*2);i++){
    const t=i*0.5;
    const tick=document.createElement('div');
    tick.style.cssText=`position:absolute;left:${t/maxT*100}%;top:0;bottom:0;border-left:1px solid var(--border);pointer-events:none`;
    if(i%2===0){
      const lbl=document.createElement('span');
      lbl.style.cssText='font-size:9px;color:var(--text3);position:absolute;top:2px;left:2px;line-height:1';
      lbl.textContent=t+'s';
      tick.appendChild(lbl);
    }
    ruler.appendChild(tick);
  }
  const colors=['#3b7ef6','#e24b4a','#1d9e75','#ba7517','#7f77dd','#d85a30','#d4537e'];
  const rowH=Math.max(4,Math.min(7,(60-22)/Math.max(1,animated.length)-2));
  animated.forEach((el,i)=>{
    const bar=document.createElement('div');
    const left=el.anim.delay/maxT*100;
    const width=el.anim.duration/maxT*100;
    const top=20+i*(rowH+2);
    const sel=el.id===selId;
    bar.style.cssText=`position:absolute;top:${top}px;height:${rowH}px;left:${left}%;width:${Math.max(1,width)}%;background:${colors[i%colors.length]};border-radius:3px;opacity:${sel?1:.75};cursor:pointer;${sel?'box-shadow:0 0 0 1.5px var(--text)':''}`;
    bar.title=`${typeLabel(el)}${el.text?' ('+el.text.slice(0,12)+')':''}: ${el.anim.type} | ${el.anim.delay}s → ${(el.anim.delay+el.anim.duration).toFixed(1)}s`;
    bar.onclick=e=>{e.stopPropagation();if(mode!=='edit')return;select(el.id);switchPanel('anim');};
    tlEls.appendChild(bar);
  });
}

// ---------- レイヤーパネル ----------

const ICON_EYE='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>';
const ICON_EYE_OFF='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><path d="M2 14L14 2"/></svg>';
const ICON_LOCK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>';
const ICON_UNLOCK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 5.8-1"/></svg>';

function updateLayers(){
  const panel=$('layers-panel');panel.innerHTML='';
  [...els].reverse().forEach(el=>{
    const item=document.createElement('div');
    item.className='layer-item'+(el.id===selId?' active':'')+(el.hidden?' is-hidden':'');
    item.draggable=true;
    item.innerHTML=`<div class="layer-icon">${escapeHTML(typeLabel(el)[0])}</div><span class="layer-name">${escapeHTML(typeLabel(el))}${el.text?' — '+escapeHTML(el.text.slice(0,10)):''}</span>${hasAnim(el)?`<span class="layer-anim-tag">${el.anim.type}</span>`:''}`;
    const eye=document.createElement('button');
    eye.className='layer-btn'+(el.hidden?' on':'');eye.title=el.hidden?'表示する':'非表示にする';
    eye.innerHTML=el.hidden?ICON_EYE_OFF:ICON_EYE;
    eye.onclick=e=>{e.stopPropagation();toggleHidden(el.id)};
    const lock=document.createElement('button');
    lock.className='layer-btn'+(el.locked?' on':'');lock.title=el.locked?'ロック解除':'ロック';
    lock.innerHTML=el.locked?ICON_LOCK:ICON_UNLOCK;
    lock.onclick=e=>{e.stopPropagation();toggleLock(el.id)};
    item.append(eye,lock);
    item.onclick=()=>select(el.id);
    item.oncontextmenu=e=>{e.preventDefault();if(el.hidden)return;select(el.id);showMenu(e.clientX,e.clientY,elementMenu(el.id))};
    item.ondragstart=e=>{layerDragId=el.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.id);item.classList.add('dragging')};
    item.ondragend=()=>{layerDragId=null;item.classList.remove('dragging')};
    item.ondragover=e=>{if(!layerDragId)return;e.preventDefault();item.classList.add('drop-target')};
    item.ondragleave=()=>item.classList.remove('drop-target');
    item.ondrop=e=>{e.preventDefault();item.classList.remove('drop-target');moveLayer(layerDragId,el.id)};
    panel.appendChild(item);
  });
}

function moveLayer(fromId,toId){
  if(!fromId||fromId===toId)return;
  moveTo(els.findIndex(x=>x.id===fromId),els.findIndex(x=>x.id===toId));
}

// ---------- コンテキストメニュー ----------

function showMenu(x,y,items){
  const m=$('ctx-menu');m.innerHTML='';
  items.forEach(it=>{
    if(it==='-'){const s=document.createElement('div');s.className='ctx-sep';m.appendChild(s);return;}
    const b=document.createElement('button');
    b.className='ctx-item'+(it.danger?' danger':'');
    b.disabled=!!it.disabled;
    b.innerHTML=`<span>${escapeHTML(it.label)}</span>${it.key?`<kbd>${it.key}</kbd>`:''}`;
    b.onclick=()=>{hideMenu();it.action();};
    m.appendChild(b);
  });
  m.style.display='block';
  const r=m.getBoundingClientRect();
  m.style.left=Math.max(4,Math.min(x,innerWidth-r.width-4))+'px';
  m.style.top=Math.max(4,Math.min(y,innerHeight-r.height-4))+'px';
}

function hideMenu(){$('ctx-menu').style.display='none'}

function elementMenu(id){
  const el=els.find(x=>x.id===id);
  return [
    {label:'複製',key:'Ctrl+D',action:duplicate},
    {label:'削除',key:'Del',danger:true,disabled:el.locked,action:deleteSelected},
    '-',
    {label:'最前面へ',action:bringToFront},
    {label:'前面へ',action:bringForward},
    {label:'背面へ',action:sendBackward},
    {label:'最背面へ',action:sendToBack},
    '-',
    {label:el.locked?'ロック解除':'ロック',action:()=>toggleLock(id)},
    {label:'非表示にする',action:()=>toggleHidden(id)},
    '-',
    {label:'アニメーションを設定',action:()=>switchPanel('anim')},
  ];
}

function addMenu(pos){
  return TYPES.map(t=>({label:'＋ '+t.label,action:()=>addEl(t.type,pos)}));
}

function openAddMenu(btn){
  const r=btn.getBoundingClientRect();
  showMenu(r.left,r.bottom+4,addMenu());
}

function handleCanvasContext(e){
  e.preventDefault();
  if(mode!=='edit')return;
  const cr=canvas.getBoundingClientRect();
  const inside=e.clientX>=cr.left&&e.clientX<=cr.right&&e.clientY>=cr.top&&e.clientY<=cr.bottom;
  const pos=inside?{x:e.clientX-cr.left,y:e.clientY-cr.top}:null;
  select(null);
  showMenu(e.clientX,e.clientY,[...addMenu(pos),'-',{label:'全削除',danger:true,disabled:!els.length,action:clearAll}]);
}

document.addEventListener('mousedown',e=>{if(!e.target.closest('#ctx-menu'))hideMenu()},true);
window.addEventListener('blur',hideMenu);
window.addEventListener('resize',hideMenu);

// ---------- インライン編集 ----------

function startInlineEdit(id){
  const el=els.find(x=>x.id===id);
  if(!el||el.locked||!INLINE_EDIT_TYPES.includes(el.type))return;
  const inner=$(id).querySelector('.el-inner');
  inner.contentEditable='true';inner.focus();
  const range=document.createRange();range.selectNodeContents(inner);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  inner.onblur=()=>{el.text=inner.textContent;inner.contentEditable='false';$('ptext').value=el.text;saveHistory();render();};
}

// ---------- Undo/Redo（スナップショット方式） ----------

function saveHistory(){
  const snap=JSON.stringify(els);
  if(hist[histIdx]===snap)return;
  hist=hist.slice(0,histIdx+1);
  hist.push(snap);
  histIdx=hist.length-1;
}

function restoreHistory(){
  els=JSON.parse(hist[histIdx]);
  select(els.find(x=>x.id===selId)?selId:null);
}

function undo(){
  if(histIdx>0){histIdx--;restoreHistory();}
}

function redo(){
  if(histIdx<hist.length-1){histIdx++;restoreHistory();}
}

function hexColor(c){
  if(!c||c==='transparent')return '#ffffff';
  if(c.startsWith('#')){
    if(c.length===4)return '#'+[...c.slice(1)].map(x=>x+x).join('');
    return c.slice(0,7);
  }
  const m=c.match(/\d+/g);
  if(!m||m.length<3)return '#111110';
  return '#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');
}

// ---------- HTML エクスポート ----------

function exportHTML(){
  const list=els.filter(e=>!e.hidden);
  const used=[...new Set(list.filter(hasAnim).map(e=>e.anim.type))];
  let css='',body='',hasClick=false;
  list.forEach((el,i)=>{
    const c=`el-${i+1}`;
    const a=el.anim;
    // 外側(.el-N)は位置とホバー/クリックの判定、内側(.in)は見た目とアニメーション
    let wrap=`position:absolute;left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
    let inAnim='',rule='',click=false;
    if(hasAnim(el)){
      if(a.trigger==='onLoad')inAnim=animCSS(a,a.delay);
      else if(a.trigger==='onHover')rule=`.${c}:hover>.in{${animCSS(a,0)}}\n`;
      else{rule=`.${c}.play>.in{${animCSS(a,0)}}\n`;wrap+='cursor:pointer;';click=hasClick=true;}
    }
    css+=`.${c}{${wrap}}\n.${c}>.in{${innerCSS(el)}${inAnim}}\n${rule}`;
    const tag=el.type==='button'?'button':'div';
    body+=`  <div class="${c}"${click?' data-click':''}><${tag} class="in"${tag==='button'?' type="button"':''}>${innerHTML(el,'r-'+c)}</${tag}></div>\n`;
  });
  const clickJS=hasClick?`<script>
document.querySelectorAll('[data-click]').forEach(function(e){e.addEventListener('click',function(){e.classList.remove('play');void e.offsetWidth;e.classList.add('play');});});
<\/script>
`:'';
  const html=`<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>エクスポートされたページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;font-family:'DM Sans',sans-serif}
.page{position:relative;width:${CANVAS_W}px;height:${canvasHeight()}px;margin:0 auto}
${used.map(t=>ANIM_KF[t]).join('\n')}
${css}</style>
</head>
<body>
<div class="page">
${body}</div>
${clickJS}</body>
</html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;link.download='craft-export.html';
  document.body.appendChild(link);link.click();
  document.body.removeChild(link);URL.revokeObjectURL(url);
}

// ---------- キーボードショートカット ----------

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideMenu();if(document.activeElement&&document.activeElement.isContentEditable){document.activeElement.blur();return;}}
  const t=e.target;
  if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable)return;
  if(mode!=='edit')return;
  const mod=e.ctrlKey||e.metaKey;
  const k=e.key.toLowerCase();
  if(mod&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(mod&&(k==='y'||(e.shiftKey&&k==='z'))){e.preventDefault();redo();return;}
  if(mod&&k==='d'){e.preventDefault();duplicate();return;}
  if(mod&&k==='b'){e.preventDefault();toggleBold();return;}
  if(mod&&k==='i'){e.preventDefault();toggleItalic();return;}
  if(e.key==='Escape'){select(null);return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();return;}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    const el=selected();if(!el||el.locked)return;
    const step=e.shiftKey?10:1;
    if(e.key==='ArrowLeft')el.x=Math.max(0,el.x-step);
    if(e.key==='ArrowRight')el.x+=step;
    if(e.key==='ArrowUp')el.y=Math.max(0,el.y-step);
    if(e.key==='ArrowDown')el.y+=step;
    updatePosFields(el);render();saveHistory();e.preventDefault();
  }
});

// ---------- 初期化 ----------

(function init(){
  // keyframes を1か所（ANIM_KF）から読み込む
  const st=document.createElement('style');
  st.textContent=Object.values(ANIM_KF).join('\n');
  document.head.appendChild(st);

  $('anim-type').innerHTML='<option value="none">— なし —</option>'+ANIM_GROUPS.map(([g,list])=>
    `<optgroup label="${g}">${list.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</optgroup>`).join('');
  SHADOWS.forEach(([v,l])=>$('pshadow').add(new Option(l,v)));

  const bar=$('left-bar');
  TYPES.forEach(t=>{
    const b=document.createElement('button');
    b.className='side-btn';b.title=t.label;
    b.innerHTML=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">${t.icon}</svg><span>${t.short||t.label}</span>`;
    b.onclick=()=>addEl(t.type);
    bar.appendChild(b);
  });
  bar.insertAdjacentHTML('beforeend','<div class="side-sep"></div>');
  const clr=document.createElement('button');
  clr.className='side-btn';clr.title='全削除';clr.style.color='var(--danger)';
  clr.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5 4V2h6v2M4 4l1 10h6l1-10"/></svg><span>全削除</span>';
  clr.onclick=clearAll;
  bar.appendChild(clr);

  // デモ要素
  const A=(type,delay,duration,extra)=>({...defAnim(),type,delay,duration,...extra});
  els=[
    makeEl('heading',{x:80,y:48,w:360,h:56,text:'ページタイトル',anim:A('slideDown',0,0.7,{easing:'ease-out'})}),
    makeEl('text',{x:80,y:106,w:360,h:36,text:'説明文をここに入力します',fontSize:'15px',color:'#6b6b68',textAlign:'left',anim:A('fadeIn',0.3,0.8)}),
    makeEl('divider',{x:80,y:150,w:360,h:16}),
    makeEl('input',{x:80,y:180,w:300,h:40,anim:A('fadeIn',0.5,0.6)}),
    makeEl('checkbox',{x:80,y:228,w:240,h:32,text:'利用規約に同意する',anim:A('fadeIn',0.6,0.6)}),
    makeEl('button',{x:80,y:280,text:'はじめる',anim:A('zoomIn',0.7,0.5,{easing:'cubic-bezier(0.34,1.56,0.64,1)'})}),
    makeEl('card',{x:500,y:60,anim:A('slideLeft',0.5,0.7,{easing:'ease-out'})}),
    makeEl('circle',{x:560,y:290,w:80,h:80,anim:A('heartbeat',0.2,1.4,{iter:'infinite'})}),
  ];
  saveHistory();render();
})();
</script>
